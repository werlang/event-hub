services:
    api:
        build: ./api
        restart: unless-stopped
        volumes:
            - ./api:/app
            - node_modules_api:/app/node_modules
        working_dir: /app
        env_file:
            - .env
        command: npm run production
        depends_on:
            - mysql
        networks:
            - default
            - agenda
    web:
        build: ./web
        restart: unless-stopped
        volumes:
            - ./web:/app
            - node_modules_web:/app/node_modules
        working_dir: /app
        env_file:
            - .env
        command: npm run production
        depends_on:
            - api
        networks:
            - default
            - agenda
    mysql:
        image: mysql:8.2
        restart: unless-stopped
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        volumes:
            - mysql:/var/lib/mysql
            - ./api/data/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
        ports:
            - 127.0.0.1:${MYSQL_PORT:-3306}:3306
volumes:
    node_modules_web:
    node_modules_api:
    mysql:
networks:
    agenda:
        name: agenda
