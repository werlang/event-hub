<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗓️ · Login</title>
    <link rel="stylesheet" href="/css/login.min.css">
    <script type="module" src="/js/login.min.js"></script>
</head>
<body>
    {{> header}}

    <main>
        <section class="panel grid-2">
            <div class="panel__block">
                <div class="tabs">
                    <button class="tab tab--active" data-tab="login">Entrar</button>
                    <button class="tab tab--disabled" data-tab="register" aria-disabled="true">Registrar</button>
                </div>
                <div id="auth-message" class="alert" hidden></div>
                <form id="login-form" class="form form--visible">
                    <label>E-mail<input type="email" name="email" required></label>
                    <label>Senha<input type="password" name="password" required></label>
                    <button class="button button--primary" type="submit">Entrar</button>
                </form>
                <form id="register-form" class="form form--disabled" aria-disabled="true">
                    <label>Nome completo<input type="text" name="name" required></label>
                    <label>E-mail institucional<input type="email" name="email" required></label>
                    <label>Senha<input type="password" name="password" required></label>
                    <input type="hidden" name="inviteToken" value="">
                    <button class="button button--primary" type="submit">Criar conta</button>
                </form>
                <p id="invite-hint" class="hint">Registro disponível apenas com link de convite válido.</p>
            </div>
            <div class="panel__block">
                <h2>Dicas rápidas</h2>
                <ul class="list">
                    <li>O token fica salvo localmente para reutilizar em outras páginas.</li>
                    <li>Use a URL de retorno para voltar à tela desejada após autenticar.</li>
                </ul>
            </div>
        </section>
    </main>

    {{> footer}}
</body>
</html>
