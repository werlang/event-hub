<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Acadêmica</title>
    <link rel="stylesheet" href="/css/index.min.css">
    <script type="module" src="/js/index.min.js"></script>
</head>

<body>
    {{> header}}
    <section class="hero" id="home-entry-surface">
        <div class="hero__content">
            <h1>Agenda Campus Charqueadas.</h1>
            <p class="subtitle">Acompanhe os eventos acadêmicos do campus</p>
            <div class="hero__actions">
                <a class="button button--primary" href="#events"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><span>Ver eventos</span></a>
                <a class="button button--ghost" href="/dashboard"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i><span>Publicar um evento</span></a>
            </div>
        </div>
        <div class="hero__image">
        </div>
    </section>

    <main>
        <section class="panel" id="events">
            <div class="panel__header" id="home-filter-surface">
                <div class="home-filters__intro">
                    <div class="panel__heading">
                        <h2>Filtrar eventos</h2>
                        <span id="home-filter-tooltip"></span>
                    </div>
                    <p class="hint">Refine a agenda com busca, categoria e intervalo de datas.</p>
                </div>
                <div class="home-filters filter-surface">
                    <form class="form form--visible filter-surface__grid home-filters__form" id="filter-form" aria-label="Filtros da agenda">
                        <label for="filter-search">
                            <span><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>Busca</span>
                            <input type="search" id="filter-search" placeholder="Palestras, oficinas, simpósios..." />
                        </label>
                        <label class="select-field" for="filter-category">
                            <span><i class="fa-solid fa-list" aria-hidden="true"></i>Categoria</span>
                            <select id="filter-category">
                                <option value="">Todas</option>
                                <option value="reuniao">Reunião Interna</option>
                                <option value="academico">Evento Acadêmico</option>
                                <option value="extensao">Extensão e Parceria</option>
                                <option value="representacao">Representação Institucional</option>
                                <option value="outro">Outro</option>
                            </select>
                        </label>
                        <label for="filter-from">
                            <span><i class="fa-solid fa-calendar-day" aria-hidden="true"></i>De</span>
                            <input type="date" id="filter-from">
                        </label>
                        <label for="filter-to">
                            <span><i class="fa-solid fa-calendar-days" aria-hidden="true"></i>Até</span>
                            <input type="date" id="filter-to">
                        </label>
                        <button class="button button--primary home-filters__submit" id="apply-filters" type="submit"><i class="fa-solid fa-filter" aria-hidden="true"></i><span>Aplicar filtros</span></button>
                    </form>
                    <div class="chips home-filters__chips" id="quick-chips"></div>
                </div>
            </div>
            <div id="events-grid" class="grid"></div>
            <p class="empty-state" id="events-empty" hidden>Nenhum evento encontrado.</p>

            <div class="home-events-pagination pagination" id="home-events-pagination" hidden>
                <p class="home-events-pagination__summary pagination__summary" id="home-events-pagination-summary">
                    Mostrando 0 de 0 eventos.
                </p>

                <nav class="home-events-pagination__controls pagination__controls" id="home-events-pagination-controls" aria-label="Paginação dos eventos da agenda"></nav>
            </div>
        </section>
    </main>

    {{> footer}}
</body>
{{{template-vars}}}
</html>
