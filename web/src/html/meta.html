<meta name="description" content="{{metaDescription}}">
<meta name="keywords" content="{{metaKeywords}}">
<meta name="robots" content="{{metaRobots}}">
<meta name="theme-color" content="#1b3a5f">
<link rel="canonical" href="{{webUrl}}{{canonicalPath}}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Agenda Acadêmica - IFSul Campus Charqueadas">
<meta property="og:title" content="{{metaTitle}}">
<meta property="og:description" content="{{metaDescription}}">
<meta property="og:url" content="{{webUrl}}{{canonicalPath}}">
<meta property="og:image" content="{{webUrl}}/assets/ifsul-900.webp">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{metaTitle}}">
<meta name="twitter:description" content="{{metaDescription}}">
<meta name="twitter:image" content="{{webUrl}}/assets/ifsul-900.webp">

<!-- Favicons -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
